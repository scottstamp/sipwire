; Module loading for the sipwire development PBX.
;
; autoload=yes loads everything that is installed. The modules that matter
; for the handsets (res_pjsip/chan_pjsip, codec_g722/codec_ulaw/codec_alaw,
; app_dial, app_echo, app_playback, app_read, app_milliwatt, res_musiconhold,
; and the core SayDigits application) are intentionally NOT listed below, so they
; are never noloaded. Also loaded automatically: codec_gsm, which the
; packaged MOH and prompt files need.
;
; BLF / MWI need (autoloaded; never noload them): res_pjsip_pubsub,
; res_pjsip_exten_state (+ res_pjsip_outbound_publish, whose symbols it uses),
; res_pjsip_dialog_info_body_generator, res_pjsip_mwi,
; res_pjsip_mwi_body_generator and app_voicemail (+ res_adsi, res_smdi).
;
; Everything under noload is a protocol, CDR, or other module this PBX does
; not use, so it is not loaded here.

[modules]
autoload=yes

; Legacy / unused channel drivers. chan_pjsip is the only SIP stack.
noload => chan_sip.so
noload => chan_iax2.so
noload => chan_skinny.so
noload => chan_mgcp.so
noload => chan_unistim.so
noload => chan_console.so

; Homer/HEP capture.
noload => res_hep.so
noload => res_hep_pjsip.so
noload => res_hep_rtcp.so

; CDR backends.
noload => cdr_adaptive_odbc.so
noload => cdr_csv.so
noload => cdr_custom.so
noload => cdr_manager.so
noload => cdr_odbc.so
noload => cdr_pgsql.so
noload => cdr_radius.so
noload => cdr_sqlite3_custom.so
noload => cdr_tds.so

; Other optional modules whose packaged defaults either fail to load or emit
; errors on this box. None of them is used for handset testing.
; Deprecated / legacy apps.
noload => app_macro.so
noload => app_adsiprog.so
noload => app_getcpeid.so
; Duplicate voicemail backends (they re-register app_voicemail's apps).
noload => app_voicemail_odbc.so
noload => app_voicemail_imap.so
; Database backends that need external servers.
noload => res_config_pgsql.so
noload => res_config_ldap.so
noload => cel_pgsql.so
noload => cel_radius.so
noload => cel_custom.so
noload => cel_tds.so
noload => cel_sqlite3_custom.so
; Dialplan/phone-provisioning/geolocation extras.
noload => pbx_dundi.so
noload => res_phoneprov.so
noload => res_pjsip_phoneprov_provider.so
noload => res_pjsip_geolocation.so
