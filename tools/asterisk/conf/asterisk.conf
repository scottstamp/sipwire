; Main Asterisk config for the sipwire development PBX.
;
; This is a TEMPLATE. The @TOKENS@ in [directories] are rendered by
; tools/asterisk/run-local.sh (into a state dir) or by the Dockerfile
; (into /etc/asterisk). Do not point Asterisk at this file directly.

[directories]
astetcdir => @ETCDIR@
astmoddir => @MODDIR@
astdatadir => @DATADIR@
astvarlibdir => @VARLIBDIR@
astdbdir => @DBDIR@
; astkeydir is a parent: Asterisk appends "keys" itself (packaged default is /var/lib/asterisk).
astkeydir => @VARLIBDIR@
astagidir => @AGIDIR@
astspooldir => @SPOOLDIR@
astrundir => @RUNDIR@
astlogdir => @LOGDIR@
astcachedir => @CACHEDIR@
