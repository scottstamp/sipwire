; Voicemail for the sipwire development PBX (app_voicemail). The handsets show
; MWI for their own mailbox (mailboxes= in pjsip.conf) and dial *97 for it.
; PINs are dev-only. Messages live in the spool dir (run-local.sh: state dir).
[general]
format=wav49|wav
attach=no
maxmsg=100
maxsecs=180
minsecs=1
maxlogins=3
; also notice messages added or removed behind app_voicemail's back
pollmailboxes=yes
pollfreq=10

[default]
1001 => 1001,Handset 1001
1002 => 1002,Handset 1002
1003 => 1003,Softphone 1003
