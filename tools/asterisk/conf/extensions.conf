; Dialplan for the sipwire development PBX.
; Phones register into context [sipwire] (see endpoint-sipwire in pjsip.conf).

; Ring a handset, then its voicemail (busy greeting if it was busy).
[dial]
exten => _100X,1,Dial(PJSIP/${EXTEN},30)
 same => n,VoiceMail(${EXTEN}@default,${IF($["${DIALSTATUS}" = "BUSY"]?b:u)})
 same => n,Hangup()

[sipwire]

; 100X: call a registered handset or softphone (1000-1009), ring up to 30 s,
; then voicemail (mailboxes 1001-1003 in voicemail.conf).
exten => _100X,1,Goto(dial,${EXTEN},1)

; Hints for BLF (the handsets SUBSCRIBE with Event: dialog). An exact
; extension beats the _100X pattern, so each one needs priority 1 as well.
exten => 1001,hint,PJSIP/1001
 same => 1,Goto(dial,${EXTEN},1)
exten => 1002,hint,PJSIP/1002
 same => 1,Goto(dial,${EXTEN},1)
exten => 1003,hint,PJSIP/1003
 same => 1,Goto(dial,${EXTEN},1)

; *44<ext>: find a handset (*441001). Rings it for 60 s with Alert-Info info=find: the
; handset (setting `find_alert`, default "find") rings at full volume with its own
; pattern, through do not disturb and quiet hours, and lights the screen. Hang up
; once you hear it.
exten => _*44XXXX,1,Dial(PJSIP/${EXTEN:3},60,b(sipwire-hdr^find^1))
 same => n,Hangup()

; *97: own voicemail box (the handset's default `vm_number`); PIN in voicemail.conf.
exten => *97,1,Answer()
 same => n,VoiceMailMain(${CALLERID(num)}@default)
 same => n,Hangup()

; 600: echo test. Plays a short prompt, then echoes the caller's audio back.
exten => 600,1,Answer()
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

; 601: answer and play a "congratulations" prompt (basic playback check).
exten => 601,1,Answer()
 same => n,Playback(demo-congrats)
 same => n,Hangup()

; 602: 1 kHz Milliwatt tone, for audio level checks. Runs until hangup.
exten => 602,1,Answer()
 same => n,Milliwatt()
 same => n,Hangup()

; 603: DTMF test. Reads up to 4 digits (RFC 4733) and reads them back.
exten => 603,1,Answer()
 same => n,Read(DIGITS,,4)
 same => n,SayDigits(${DIGITS})
 same => n,Hangup()

; 604: music on hold, default class. Runs until hangup.
exten => 604,1,Answer()
 same => n,MusicOnHold()
 same => n,Hangup()

; Pre-dial handlers (Dial b() option): run on the outgoing channel, add SIP headers.
[sipwire-hdr]
exten => find,1,Set(PJSIP_HEADER(add,Alert-Info)=<http://localhost>\;info=find)
 same => n,Return()
