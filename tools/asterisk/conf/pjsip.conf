; PJSIP for the sipwire development PBX (chan_pjsip only, no chan_sip).
;
; Endpoints 1001, 1002 are the handsets; 1003 is a softphone for manual tests.
; Passwords are dev-only and follow the pattern sipwire<ext>.
;
; BLF: the handsets SUBSCRIBE (Event: dialog) to the hints in [sipwire]
; (extensions.conf); allow_subscribe is the endpoint default, set explicitly.
; MWI: each mailbox 100X@default (voicemail.conf) is
;   - on the AOR: a "message-summary" SUBSCRIBE to sip:100X@<pbx> gets it;
;   - on the endpoint: unsolicited NOTIFYs while the phone has not subscribed
;     (mwi_subscribe_replaces_unsolicited stops them once it has).

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; ---------------------------------------------------------------- templates

[endpoint-sipwire](!)
type=endpoint
transport=transport-udp
context=sipwire
disallow=all
allow=g722,ulaw,alaw
dtmf_mode=rfc4733
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
allow_subscribe=yes
mwi_subscribe_replaces_unsolicited=yes

[aor-sipwire](!)
type=aor
max_contacts=1
remove_existing=yes
; qualify_frequency is an AOR option in Asterisk PJSIP, not an endpoint option.
qualify_frequency=30

; ---------------------------------------------------------------- handsets

[1001](endpoint-sipwire)
type=endpoint
auth=1001
aors=1001
mailboxes=1001@default

[1001]
type=auth
auth_type=userpass
username=1001
password=sipwire1001

[1001](aor-sipwire)
type=aor
mailboxes=1001@default

[1002](endpoint-sipwire)
type=endpoint
auth=1002
aors=1002
mailboxes=1002@default

[1002]
type=auth
auth_type=userpass
username=1002
password=sipwire1002

[1002](aor-sipwire)
type=aor
mailboxes=1002@default

; ---------------------------------------------------------------- softphone

[1003](endpoint-sipwire)
type=endpoint
auth=1003
aors=1003
mailboxes=1003@default

[1003]
type=auth
auth_type=userpass
username=1003
password=sipwire1003

[1003](aor-sipwire)
type=aor
mailboxes=1003@default
