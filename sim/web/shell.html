<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sipwire simulator</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --line: #30363d; --fg: #e6edf3;
    color-scheme: dark; --dim: #8b949e; --accent: #2f81f7; --key: #21262d; --keyhi: #30363d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { padding: 16px; }
  h1 { font-size: 14px; margin: 0 0 12px; font-weight: 600; letter-spacing: .02em; }
  h1 small { color: var(--dim); font-weight: 400; margin-left: 8px; }
  .layout { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }

  .device { background: #000; padding: 10px; border-radius: 14px;
    border: 1px solid var(--line); flex: none; }
  /* The canvas is 240x320 native; show it 2x, crisp. */
  canvas#canvas { display: block; width: 480px; height: 640px; outline: none;
    image-rendering: pixelated; image-rendering: crisp-edges; cursor: pointer; }

  .side { flex: 1 1 380px; min-width: 320px; max-width: 800px; display: grid; gap: 12px;
    grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); align-content: start; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .card h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--dim); margin: 0 0 8px; font-weight: 600; }
  .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .row > label { width: 70px; color: var(--dim); flex: none; }
  .row .val { width: 62px; white-space: nowrap; text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; flex: none; }
  /* Note: emcc minifies the shell and drops type="text", so don't select on it. */
  input:not([type=range]):not([type=checkbox]), select { background: #0d1117; color: var(--fg); border: 1px solid var(--line);
    border-radius: 5px; padding: 4px 6px; font: inherit; min-width: 0; }
  .row > input:not([type=range]):not([type=checkbox]) { flex: 1; }
  input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
  button { background: var(--key); color: var(--fg); border: 1px solid var(--line);
    border-radius: 5px; padding: 5px 10px; font: inherit; cursor: pointer; }
  button:hover { background: var(--keyhi); }
  button:active { background: var(--accent); }

  .split { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; }
  .keypad { display: grid; grid-template-columns: repeat(3, 52px); gap: 6px; }
  .keypad button { height: 44px; font-size: 18px; padding: 0; user-select: none; touch-action: none; }
  .keypad button.down { background: var(--accent); }
  .hint { color: var(--dim); font-size: 11px; margin-top: 8px; }

  pre { margin: 0; font: 11.5px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    white-space: pre-wrap; word-break: break-all; }
  #log { height: 130px; overflow: auto; color: var(--dim); }
  #log .t { color: #6e7681; }
  #json { color: #a5d6ff; }
  .tools { display: flex; justify-content: space-between; align-items: center; }
  .tools button { padding: 1px 8px; font-size: 11px; }
  #status { color: var(--dim); font-weight: 400; }
</style>
</head>
<body>
<h1>sipwire UI simulator <small id="status">loading...</small></h1>
<div class="layout">
  <div class="device"><canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas></div>

  <div class="side">
    <div class="card">
      <h2>Keypad</h2>
      <div class="split">
        <div class="keypad" id="keypad"></div>
        <div class="hint">Press = PRESS<br>Hold 800 ms = LONG (+REPEAT)<br>Keyboard 0-9 * # also work (focus outside text fields).</div>
      </div>
    </div>

    <div class="card">
      <h2>Network / account / power</h2>
      <div class="row"><label for="net">Network</label>
        <select id="net"><option value="0">Off</option><option value="1">Connecting</option><option value="2">Connected</option></select>
        <input type="range" id="rssi" min="-95" max="-30" value="-55"><span class="val" id="rssiv">-55 dBm</span></div>
      <div class="row"><label for="reg">Registration</label>
        <select id="reg"><option value="0">None</option><option value="1">Registering</option><option value="2">Registered</option><option value="3">Failed</option></select></div>
      <div class="row"><label for="bat">Battery</label>
        <input type="range" id="bat" min="-1" max="100" value="-1"><span class="val" id="batv">none</span>
        <label style="width:auto"><input type="checkbox" id="chg"> charging</label></div>
      <div class="row"><label for="clock">Clock</label>
        <input type="text" id="clock" placeholder="HH:MM" maxlength="5" style="max-width:80px">
        <button id="clocknow" type="button">now</button><button id="clockclr" type="button">clear</button>
        <label><input type="checkbox" id="c24"> 24 h</label></div>
    </div>

    <div class="card">
      <h2>BLF / voicemail</h2>
      <div class="row"><label for="blfn">Keys</label>
        <select id="blfn"><option>0</option><option>1</option><option>2</option><option selected>3</option><option>4</option>
          <option>5</option><option>6</option><option>7</option><option>8</option></select>
        <button id="blfset" type="button">set</button></div>
      <div class="row"><label for="blfi">Key #</label>
        <select id="blfi"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
          <option>6</option><option>7</option><option>8</option></select>
        <select id="blfst"><option value="0">unknown</option><option value="1" selected>idle</option>
          <option value="2">ringing</option><option value="3">busy</option></select>
        <button id="blfstate" type="button">apply</button></div>
      <div class="row"><label for="mwin">Voicemail</label>
        <input type="text" id="mwin" value="2" title="new messages" style="max-width:56px; flex:none">
        <label style="width:auto"><input type="checkbox" id="mwiw"> waiting</label>
        <button id="mwiset" type="button">set</button></div>
    </div>

    <div class="card">
      <h2>Call events</h2>
      <div class="row"><label for="inum">Number</label><input type="text" id="inum" value="1001"></div>
      <div class="row"><label for="iname">Name</label><input type="text" id="iname" value="Bob Example"></div>
      <div class="row"><label></label>
        <button id="incoming" type="button">Incoming call</button>
        <button id="rhangup" type="button">Remote hangup</button>
        <button id="waiting" type="button">Waiting call</button>
        <label style="width:auto"><input type="checkbox" id="pagechk"> page</label>
        <input type="text" id="rcode" value="0" title="SIP status code (0 = normal)" style="max-width:56px; flex:none"></div>
    </div>

    <div class="card">
      <h2>Locks</h2>
      <div class="row"><label for="tlock">Touch lock s</label>
        <input type="text" id="tlock" value="5" title="in-call touch lock after N s on the handset, 0 = off" style="max-width:56px; flex:none">
        <button id="tlockset" type="button">set</button>
        <label style="width:auto"><input type="checkbox" id="autolock"> keypad auto-lock</label>
        <button id="dispoff" type="button">Screen off</button></div>
    </div>

    <div class="card">
      <div class="tools"><h2>Action log</h2><button id="logclr" type="button">clear</button></div>
      <pre id="log"></pre>
    </div>

    <div class="card">
      <h2>Model</h2>
      <pre id="json"></pre>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var ready = false;

  // ---- hooks called from C (EM_JS in sim_main.c) ----
  function logLine(msg) {
    var el = $('log');
    var t = new Date().toTimeString().slice(0, 8);
    var s = document.createElement('div');
    s.innerHTML = '<span class="t">' + t + '</span> ';
    s.appendChild(document.createTextNode(msg));
    el.appendChild(s);
    while (el.childNodes.length > 300) el.removeChild(el.firstChild);
    el.scrollTop = el.scrollHeight;
  }

  var refreshQueued = false;
  function refreshModel() {
    refreshQueued = false;
    if (!ready) return;
    try { $('json').textContent = JSON.stringify(JSON.parse(getModelJson()), null, 2); }
    catch (e) { $('json').textContent = String(e); }
  }
  function getModelJson() {
    return Module.ccall('sim_get_model_json', 'string', [], []);
  }

  window.Module = {
    canvas: $('canvas'),
    print: function (t) { console.log(t); logLine(t); },
    printErr: function (t) { console.warn(t); logLine('[err] ' + t); },
    simLog: logLine,
    simTouchCal: function (on) { calActive = on; if (!on) calRelease(); },
    simModelChanged: function () {
      if (!refreshQueued) { refreshQueued = true; requestAnimationFrame(refreshModel); }
    },
    simReady: function () {
      ready = true;
      window.simReady = true;
      $('status').textContent = '240x320, 2x';
      syncControlsFromModel();
      refreshModel();
    },
    onAbort: function (w) { $('status').textContent = 'aborted: ' + w; }
  };
  window.addEventListener('error', function (e) { $('status').textContent = 'error: ' + e.message; });

  // Programmatic API (screenshots / tests): window.sim.set_net(2, -50) etc.
  window.sim = {
    set_net: function (s, r) { Module.ccall('sim_set_net', null, ['number', 'number'], [s, r]); },
    set_reg: function (s) { Module.ccall('sim_set_reg', null, ['number'], [s]); },
    set_battery: function (p, c) { Module.ccall('sim_set_battery', null, ['number', 'number'], [p, c ? 1 : 0]); },
    incoming: function (n, nm) { Module.ccall('sim_incoming', null, ['string', 'string'], [n, nm || '']); },
    remote_hangup: function (c) { Module.ccall('sim_remote_hangup', null, ['number'], [c || 0]); },
    set_call: function (st, n, nm, sec) { Module.ccall('sim_set_call', null, ['number', 'string', 'string', 'number'], [st, n || '', nm || '', sec || 0]); },
    key: function (k, a) { Module.ccall('sim_key', null, ['number', 'number'], [typeof k === 'string' ? k.charCodeAt(0) : k, a || 0]); },
    set_time: function (s) { Module.ccall('sim_set_time', null, ['string'], [s]); },   // 'HH:MM', 24 h local time
    set_clock24: function (on) { Module.ccall('sim_set_clock24', null, ['number'], [on ? 1 : 0]); },
    // state: 0 idle, 1 running, 2 done, 3 failed (no fake download; use Settings > Update for that)
    set_ota: function (st, pct, msg) { Module.ccall('sim_set_ota', null, ['number', 'number', 'string'], [st, pct || 0, msg || '']); },
    touch_raw: function (ax, ay, p) { Module.ccall('sim_touch_raw', null, ['number', 'number', 'number'], [ax, ay, p ? 1 : 0]); },
    // BLF tiles: set_blf_count(n); set_blf(i, ext, label, state) with state 0 unknown, 1 idle, 2 ringing, 3 busy
    set_blf_count: function (n) { Module.ccall('sim_set_blf_count', null, ['number'], [n]); },
    set_blf: function (i, ext, label, st) { Module.ccall('sim_set_blf', null, ['number', 'string', 'string', 'number'], [i, ext || '', label || '', st || 0]); },
    set_mwi: function (w, nw, old) { Module.ccall('sim_set_mwi', null, ['number', 'number', 'number'], [w ? 1 : 0, nw || 0, old || 0]); },
    // call features: set_second(state, number, name, seconds) state 3 = waiting, 5 = held, 0 = none;
    // set_xfer(state, attended, code, target) state 0 idle .. 6 failed (ui_xfer_state_t)
    set_second: function (st, n, nm, sec) { Module.ccall('sim_set_second', null, ['number', 'string', 'string', 'number'], [st, n || '', nm || '', sec || 0]); },
    set_xfer: function (st, att, code, target) { Module.ccall('sim_set_xfer', null, ['number', 'number', 'number', 'string'], [st, att ? 1 : 0, code || 0, target || '']); },
    set_dnd: function (on) { Module.ccall('sim_set_dnd', null, ['number'], [on ? 1 : 0]); },
    set_page: function (on) { Module.ccall('sim_set_page', null, ['number'], [on ? 1 : 0]); },
    set_touch_lock: function (s) { Module.ccall('sim_set_touch_lock', null, ['number'], [s]); },
    set_keypad_autolock: function (on) { Module.ccall('sim_set_keypad_autolock', null, ['number'], [on ? 1 : 0]); },
    display_off: function () { Module.ccall('sim_display_off', null, [], []); },
    waiting: function (n, nm) { Module.ccall('sim_waiting', null, ['string', 'string'], [n, nm || '']); },
    // directory stubs: mark the n newest missed incoming calls unseen; clear_directory(0 history | 1 contacts)
    set_unseen: function (n) { Module.ccall('sim_set_unseen', null, ['number'], [n]); },
    clear_directory: function (w) { Module.ccall('sim_clear_directory', null, ['number'], [w]); },
    // history_add(dir 0 in | 1 out, result 0 answered | 1 missed | 2 declined | 3 dnd, number, name, seconds)
    history_add: function (d, r, n, nm, s) { Module.ccall('sim_history_add', null, ['number', 'number', 'string', 'string', 'number'], [d, r, n, nm || '', s || 0]); },
    // missed(number, name, dnd): incoming call refused without ringing (CALL_EVENT_MISSED)
    missed: function (n, nm, dnd) { Module.ccall('sim_missed', null, ['string', 'string', 'number'], [n, nm || '', dnd ? 1 : 0]); },
    model: function () { return JSON.parse(getModelJson()); }
  };

  // ---- touch calibration: fake raw touch panel ----
  // While the calibration screen is open the C side switches LVGL's mouse off
  // (simTouchCal) and these canvas mouse events become raw samples instead, as the
  // device's display hook would deliver them. The fake panel is rotated 180 degrees
  // and offset, so the calibration math has real work to do:
  //   raw_x = 3900 - 15 * x,  raw_y = 3900 - 11 * y   (x, y in canvas pixels, 240x320)
  // A held button repeats the last sample every 30 ms, like the polled touch driver.
  var calActive = false, calDown = false, calLast = [0, 0], calTimer = null;
  function fakeRaw(e) {
    var r = $('canvas').getBoundingClientRect();
    var x = (e.clientX - r.left) * 240 / r.width, y = (e.clientY - r.top) * 320 / r.height;
    return [Math.round(3900 - 15 * x), Math.round(3900 - 11 * y)];
  }
  function calRelease() {
    if (!calDown) return;
    calDown = false;
    clearInterval(calTimer);
    window.sim.touch_raw(0, 0, 0);
  }
  $('canvas').addEventListener('mousedown', function (e) {
    if (!calActive || !ready) return;
    calDown = true;
    calLast = fakeRaw(e);
    window.sim.touch_raw(calLast[0], calLast[1], 1);
    clearInterval(calTimer);
    calTimer = setInterval(function () { window.sim.touch_raw(calLast[0], calLast[1], 1); }, 30);
  });
  window.addEventListener('mousemove', function (e) { if (calDown) calLast = fakeRaw(e); });
  window.addEventListener('mouseup', calRelease);

  // ---- controls ----
  function applyNet() {
    var r = +$('rssi').value;
    $('rssiv').textContent = r + ' dBm';
    window.sim.set_net(+$('net').value, r);
  }
  function applyBat() {
    var p = +$('bat').value;
    $('batv').textContent = p < 0 ? 'none' : p + '%';
    window.sim.set_battery(p, $('chg').checked);
  }
  $('net').addEventListener('change', applyNet);
  $('rssi').addEventListener('input', applyNet);
  $('reg').addEventListener('change', function () { window.sim.set_reg(+$('reg').value); });
  $('bat').addEventListener('input', applyBat);
  $('chg').addEventListener('change', applyBat);
  $('clock').addEventListener('input', function () {
    var v = $('clock').value;
    if (v === '' || /^\d{1,2}:\d{2}$/.test(v)) window.sim.set_time(v);
  });
  $('clocknow').addEventListener('click', function () {
    var d = new Date(), p = function (n) { return (n < 10 ? '0' : '') + n; };
    $('clock').value = p(d.getHours()) + ':' + p(d.getMinutes());
    window.sim.set_time($('clock').value);
  });
  $('c24').addEventListener('change', function () { window.sim.set_clock24($('c24').checked); });
  $('clockclr').addEventListener('click', function () { $('clock').value = ''; window.sim.set_time(''); });
  var BLF_DEMO = [['1002', 'Bob'], ['1003', 'Front desk'], ['1004', ''], ['1005', 'Carol'],
                  ['1006', 'Dave'], ['1007', 'Reception'], ['1008', 'Eve'], ['1009', 'Lab']];
  $('blfset').addEventListener('click', function () {
    var n = +$('blfn').value;
    window.sim.set_blf_count(0);
    for (var i = 0; i < n; i++) window.sim.set_blf(i, BLF_DEMO[i][0], BLF_DEMO[i][1], 1);
  });
  $('blfstate').addEventListener('click', function () {
    var i = +$('blfi').value - 1, m = window.sim.model();
    if (i < m.blf.length) window.sim.set_blf(i, m.blf[i].ext, m.blf[i].label, +$('blfst').value);
  });
  $('mwiset').addEventListener('click', function () {
    window.sim.set_mwi($('mwiw').checked, parseInt($('mwin').value, 10) || 0, 0);
  });
  $('incoming').addEventListener('click', function () { window.sim.incoming($('inum').value, $('iname').value); });
  $('waiting').addEventListener('click', function () { window.sim.waiting($('inum').value, $('iname').value); });
  $('pagechk').addEventListener('change', function () { window.sim.set_page($('pagechk').checked); });
  $('tlockset').addEventListener('click', function () { window.sim.set_touch_lock(parseInt($('tlock').value, 10) || 0); });
  $('autolock').addEventListener('change', function () { window.sim.set_keypad_autolock($('autolock').checked); });
  $('dispoff').addEventListener('click', function () { window.sim.display_off(); });
  $('rhangup').addEventListener('click', function () { window.sim.remote_hangup(parseInt($('rcode').value, 10) || 0); });
  $('logclr').addEventListener('click', function () { $('log').textContent = ''; });

  var NET = { OFF: 0, CONNECTING: 1, CONNECTED: 2 };
  var REG = { NONE: 0, REGISTERING: 1, REGISTERED: 2, FAILED: 3 };
  function syncControlsFromModel() {
    var m = window.sim.model();
    $('net').value = NET[m.net]; $('rssi').value = m.rssi || -55;
    $('rssiv').textContent = $('rssi').value + ' dBm';
    $('reg').value = REG[m.reg];
    $('bat').value = m.battery_pct; $('chg').checked = m.charging;
    $('batv').textContent = m.battery_pct < 0 ? 'none' : m.battery_pct + '%';
    $('clock').value = m.time_raw; $('c24').checked = m.clock_24h;
  }

  // ---- keypad: mirrors components/keypad: PRESS on down, LONG at 800 ms, REPEAT every 150 ms ----
  var KEYS = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '*', '0', '#'];
  var LONG_MS = 800, REPEAT_MS = 150;
  var held = {};   // key -> {timer, long}
  function keyDown(k, btn) {
    if (!ready || held[k]) return;
    var h = held[k] = { long: false, btn: btn };
    if (btn) btn.classList.add('down');
    window.sim.key(k, 0);
    h.timer = setTimeout(function () {
      h.long = true;
      window.sim.key(k, 1);
      h.timer = setInterval(function () { window.sim.key(k, 2); }, REPEAT_MS);
    }, LONG_MS);
  }
  function keyUp(k) {
    var h = held[k];
    if (!h) return;
    clearTimeout(h.timer);
    clearInterval(h.timer);
    if (h.btn) h.btn.classList.remove('down');
    delete held[k];
  }
  var pad = $('keypad');
  KEYS.forEach(function (k) {
    var b = document.createElement('button');
    b.type = 'button'; b.textContent = k; b.dataset.key = k;
    b.addEventListener('pointerdown', function (e) { b.setPointerCapture(e.pointerId); keyDown(k, b); });
    b.addEventListener('pointerup', function () { keyUp(k); });
    b.addEventListener('pointercancel', function () { keyUp(k); });
    pad.appendChild(b);
  });
  function editable(t) { return t && (t.tagName === 'INPUT' && t.type === 'text' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT'); }
  function btnFor(k) { return pad.querySelector('[data-key="' + (k === '"' ? '\\"' : k) + '"]'); }
  document.addEventListener('keydown', function (e) {
    if (editable(e.target) || e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
    if (KEYS.indexOf(e.key) >= 0) { e.preventDefault(); keyDown(e.key, btnFor(e.key)); }
  });
  document.addEventListener('keyup', function (e) {
    if (KEYS.indexOf(e.key) >= 0) keyUp(e.key);
  });
})();
</script>
{{{ SCRIPT }}}
</body>
</html>
