; Voicemail for the integration / QEMU tests (app_voicemail). Messages land in
; the private instance's spool dir; integration.sh deletes them from there and
; pollmailboxes notices that within a second (-> MWI "no").
[general]
format = wav
attach = no
minsecs = 0
maxsilence = 0
pollmailboxes = yes
pollfreq = 1

[default]
1001 => 1234,Alice
1002 => 1234,Bob
1003 => 1234,Carol
