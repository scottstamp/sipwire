; PJSIP on 127.0.0.1:5080 (5060 belongs to tools/asterisk).
[global]
type = global
user_agent = sipwire-test-asterisk

[transport-udp]
type = transport
protocol = udp
bind = 127.0.0.1:5080

[phone](!)
type = endpoint
context = sipwire-test
disallow = all
allow = g722,ulaw,alaw
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
dtmf_mode = rfc4733
; BLF: subscriptions to hints in the endpoint context (allow_subscribe is the
; default); MWI: unsolicited NOTIFYs for `mailboxes` below until the phone
; subscribes itself (then only the subscription gets them)
allow_subscribe = yes
mwi_subscribe_replaces_unsolicited = yes

[auth](!)
type = auth
auth_type = userpass

[aor](!)
type = aor
max_contacts = 1
remove_existing = yes
qualify_frequency = 0

; mailboxes on the endpoint: unsolicited MWI; on the AOR: the mailbox a
; "message-summary" SUBSCRIBE to the AOR (sip:100X@...) gets
[1001](phone)
auth = 1001-auth
aors = 1001
mailboxes = 1001@default
[1001-auth](auth)
username = 1001
password = secret1001
[1001](aor)
mailboxes = 1001@default

[1002](phone)
auth = 1002-auth
aors = 1002
mailboxes = 1002@default
[1002-auth](auth)
username = 1002
password = secret1002
[1002](aor)
mailboxes = 1002@default

[1003](phone)
auth = 1003-auth
aors = 1003
mailboxes = 1003@default
[1003-auth](auth)
username = 1003
password = secret1003
[1003](aor)
mailboxes = 1003@default
