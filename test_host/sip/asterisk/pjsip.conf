; PJSIP on 127.0.0.1:5080 (5060 belongs to tools/asterisk).
[global]
type = global
user_agent = sipwire-test-asterisk

[transport-udp]
type = transport
protocol = udp
bind = 127.0.0.1:5080

[phone](!)
type = endpoint
context = sipwire-test
disallow = all
allow = g722,ulaw,alaw
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
dtmf_mode = rfc4733

[auth](!)
type = auth
auth_type = userpass

[aor](!)
type = aor
max_contacts = 1
remove_existing = yes
qualify_frequency = 0

[1001](phone)
auth = 1001-auth
aors = 1001
[1001-auth](auth)
username = 1001
password = secret1001
[1001](aor)

[1002](phone)
auth = 1002-auth
aors = 1002
[1002-auth](auth)
username = 1002
password = secret1002
[1002](aor)
