[general]
static = yes
writeprotect = yes

[sipwire-test]
; echo test
exten => 600,1,Answer()
 same => n,Echo()
; answers, waits 2 s, hangs up (→ BYE towards the caller)
exten => 601,1,Answer()
 same => n,Wait(2)
 same => n,Hangup()
; phone to phone
exten => _100X,1,Dial(PJSIP/${EXTEN},20)
 same => n,Hangup()
