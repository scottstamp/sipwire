[general]
static = yes
writeprotect = yes

[sipwire-test]
; echo test
exten => 600,1,Answer()
 same => n,Echo()
; answers, waits 2 s, hangs up (→ BYE towards the caller)
exten => 601,1,Answer()
 same => n,Wait(2)
 same => n,Hangup()
; records 3 s of the caller to ${SIPWIRE_REC}.sln16, i.e. through Asterisk's
; own decoder (G.722 -> slin16); integration.sh sets SIPWIRE_REC
exten => 602,1,Answer()
 same => n,Record(${SIPWIRE_REC}.sln16,0,3,qx)
 same => n,Hangup()
; phone to phone. 1001-1003 have hints for BLF ("dialog" subscriptions, RFC
; 4235); an exact extension wins over a pattern, so each needs its priority 1.
exten => 1001,hint,PJSIP/1001
 same => 1,Dial(PJSIP/${EXTEN},20)
 same => n,Hangup()
exten => 1002,hint,PJSIP/1002
 same => 1,Dial(PJSIP/${EXTEN},20)
 same => n,Hangup()
exten => 1003,hint,PJSIP/1003
 same => 1,Dial(PJSIP/${EXTEN},20)
 same => n,Hangup()
exten => _100X,1,Dial(PJSIP/${EXTEN},20)
 same => n,Hangup()
; voicemail: *97 = own mailbox; 700X leaves a message for 100X (no greeting,
; integration.sh sends a tone and hangs up)
exten => *97,1,Answer()
 same => n,VoiceMailMain(${CALLERID(num)}@default,s)
 same => n,Hangup()
exten => _700X,1,Answer()
 same => n,VoiceMail(100${EXTEN:3}@default,s)
 same => n,Hangup()
