[general]
static = yes
writeprotect = yes

[sipwire-test]
; echo test
exten => 600,1,Answer()
 same => n,Echo()
; answers, waits 2 s, hangs up (→ BYE towards the caller)
exten => 601,1,Answer()
 same => n,Wait(2)
 same => n,Hangup()
; records 3 s of the caller to ${SIPWIRE_REC}.sln16, i.e. through Asterisk's
; own decoder (G.722 -> slin16); integration.sh sets SIPWIRE_REC
exten => 602,1,Answer()
 same => n,Record(${SIPWIRE_REC}.sln16,0,3,qx)
 same => n,Hangup()
; phone to phone. 1001-1003 have hints for BLF ("dialog" subscriptions, RFC
; 4235); an exact extension wins over a pattern, so each needs its priority 1.
exten => 1001,hint,PJSIP/1001
 same => 1,Dial(PJSIP/${EXTEN},20)
 same => n,Hangup()
exten => 1002,hint,PJSIP/1002
 same => 1,Dial(PJSIP/${EXTEN},20)
 same => n,Hangup()
exten => 1003,hint,PJSIP/1003
 same => 1,Dial(PJSIP/${EXTEN},20)
 same => n,Hangup()
exten => _100X,1,Dial(PJSIP/${EXTEN},20)
 same => n,Hangup()
; voicemail: *97 = own mailbox; 700X leaves a message for 100X (no greeting,
; integration.sh sends a tone and hangs up)
exten => *97,1,Answer()
 same => n,VoiceMailMain(${CALLERID(num)}@default,s)
 same => n,Hangup()
exten => _700X,1,Answer()
 same => n,VoiceMail(100${EXTEN:3}@default,s)
 same => n,Hangup()
; transfer target that "answers": a blind-transferred caller is already up, so
; Asterisk reports the transfer (NOTIFY sipfrag 200) only when a Dial answers
exten => 603,1,Dial(Local/600@sipwire-test/n,10)
 same => n,Hangup()
; pages / intercom to 1001: the INVITE carries an auto-answer header, added on
; the outgoing channel by a pre-dial handler (as with Page() + PJSIP_HEADER)
exten => 650,1,Dial(PJSIP/1001,10,b(sipwire-hdr^callinfo^1))
 same => n,Hangup()
exten => 651,1,Dial(PJSIP/1001,10,b(sipwire-hdr^alertinfo^1))
 same => n,Hangup()
; find the handset: rings 1001 with Alert-Info info=find (its `find_alert` marker)
exten => 652,1,Dial(PJSIP/1001,10,b(sipwire-hdr^find^1))
 same => n,Hangup()

[sipwire-hdr]
exten => callinfo,1,Set(PJSIP_HEADER(add,Call-Info)=<sip:127.0.0.1>\;answer-after=0)
 same => n,Return()
exten => alertinfo,1,Set(PJSIP_HEADER(add,Alert-Info)=<http://www.notused.com>\;info=alert-autoanswer\;delay=0)
 same => n,Return()
exten => find,1,Set(PJSIP_HEADER(add,Alert-Info)=<http://www.notused.com>\;info=find)
 same => n,Return()
